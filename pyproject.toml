[project]
name = "somatriq"
version = "0.0.0"
description = "Somatriq — self-hosted personal biometric intelligence platform (server monorepo root)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Workspace members (explicit so `uv sync` installs the full server —
    # same command works locally, in CI, and in the Docker builder).
    "somatriq-api",
    "somatriq-mcp",
    "somatriq-worker",
    "somatriq-scheduler",
    "somatriq-agent",
    "somatriq-telegram",
    "somatriq-notifications",
    "somatriq-core",
    "somatriq-contracts",
    "somatriq-db",
    "somatriq-replay",
    "somatriq-analytics",
    "somatriq-agent-tools",
    "somatriq-connectors",
    "somatriq-observability",
]

[tool.uv.sources]
somatriq-api = { workspace = true }
somatriq-mcp = { workspace = true }
somatriq-worker = { workspace = true }
somatriq-scheduler = { workspace = true }
somatriq-agent = { workspace = true }
somatriq-telegram = { workspace = true }
somatriq-notifications = { workspace = true }
somatriq-core = { workspace = true }
somatriq-contracts = { workspace = true }
somatriq-db = { workspace = true }
somatriq-replay = { workspace = true }
somatriq-analytics = { workspace = true }
somatriq-agent-tools = { workspace = true }
somatriq-connectors = { workspace = true }
somatriq-observability = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# Project-wide tooling. One type checker project-wide: mypy (spec §109).
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]  # CLI scripts print — that is their interface

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
# Shared-name test files collide under explicit_package_bases (every
# mypy_path base resolves them to the same module): the M7 services'
# tests/conftest.py and the M8 agent_tests conftest pair (packages/
# agent_tools + services/agent). Keep discovery to one of each; the excluded
# ones are injected by pytest fixtures, never imported by name.
exclude = '^services/(telegram|scheduler|notifications)/tests/conftest\.py$|^packages/agent_tools/agent_tests/conftest\.py$'
mypy_path = [
    "services/api",
    "services/mcp",
    "services/worker",
    "services/scheduler",
    "services/agent",
    "services/telegram",
    "services/notifications",
    "packages/core",
    "packages/contracts",
    "packages/db",
    "packages/replay",
    "packages/analytics",
    "packages/agent_tools",
    "packages/connectors",
    "packages/observability",
]

[tool.pytest.ini_options]
testpaths = ["services", "packages", "tests"]
asyncio_mode = "auto"

[tool.uv.workspace]
members = ["services/*", "packages/*"]
