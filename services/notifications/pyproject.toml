[project]
name = "somatriq-notifications"
version = "0.0.0"
description = "Notification engine (M7): outbox drain, telegram + ntfy (spec 105-106)."
requires-python = ">=3.12"
dependencies = [
    "somatriq-contracts",
    "somatriq-db",
    "somatriq-analytics",
    # Same Bot API client the telegram service uses (one implementation).
    "somatriq-telegram",
]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_notifications"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
