[project]
name = "somatriq-api"
version = "0.0.0"
description = "Somatriq HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
