[project]
name = "somatriq-api"
version = "0.0.0"
description = "Somatriq HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "argon2-cffi>=23",
    "pyjwt>=2.9",
    "somatriq-contracts",
    "somatriq-db",
    "somatriq-replay",
    "somatriq-analytics",
    # M8: the /coach/ask endpoint drives the agent's coach engine directly
    # (deterministic tools + privacy chokepoint + provider, ADR 0009).
    "somatriq-agent",
    # zoneinfo has no system tz database on Windows (spec §161: only real needs)
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
