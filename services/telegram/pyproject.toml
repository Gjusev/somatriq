[project]
name = "somatriq-telegram"
version = "0.0.0"
description = "Telegram bot (M7): morning brief, journal, checkins (spec 101-104)."
requires-python = ">=3.12"
dependencies = [
    "somatriq-contracts",
    "somatriq-db",
    "somatriq-analytics",
    # zoneinfo has no system tz database on Windows (spec 161: only real needs)
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_telegram"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
