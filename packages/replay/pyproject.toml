[project]
name = "somatriq-replay"
version = "0.0.0"
description = "Raw archive replay: journal decode, fidelity verification, versioned reprocessing (spec §47-49, §140; ADR 0003/0012)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "zstandard>=0.23",
    "somatriq-contracts",
    "somatriq-db",
]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_replay"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
