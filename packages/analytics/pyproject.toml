[project]
name = "somatriq-analytics"
version = "0.0.0"
description = "Deterministic health analytics: HRV, baselines, recovery, correlations."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "somatriq-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_analytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
