[project]
name = "somatriq-connectors"
version = "0.0.0"
description = "Server-side connectors (Huawei, Withings, Garmin, Oura, CSV - spec 126)."
requires-python = ">=3.12"
dependencies = [
    # The frozen metric catalog (VENDOR_DAILY_METRICS) and the canonical
    # DailyObservationItem are the connector's normalization target (§127).
    "somatriq-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["somatriq_connectors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
